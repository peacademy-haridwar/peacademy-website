<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Gen-P AI - Parashar Educational Academy</title>
<link rel="icon" type="image/jpeg" href="Academy_logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
}

html, body {
    background: #0b0f19;
    color: #f1f5f9;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 1000px;
    height: 100%;
    background: #111827;
    border: none;
    border-radius: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: none;
}

@media(min-width: 768px) {
    .app {
        height: 95vh;
        border: 1px solid #1f2937;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
}

/* HEADER & LOGO BOX FIX */
.header {
    background: #0f172a;
    border-bottom: 1px solid #1f2937;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand-icon {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #1e293b;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    border: 2px solid #38bdf8;
    flex-shrink: 0;
    padding: 3px;
}

.brand-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
}

.brand-text {
    min-width: 0;
}

.brand h1 {
    font-size: 16px;
    color: #38bdf8;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.5px;
}

.brand small {
    display: block;
    font-size: 10px;
    color: #94a3b8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.header-btn {
    border: 1px solid #334155;
    background: #1e293b;
    color: #cbd5e1;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.header-btn:hover {
    background: #334155;
    color: #fff;
}

.header-btn.active-mute {
    background: #dc2626;
    color: #fff;
    border-color: #ef4444;
}

.header-btn.active-speaking {
    background: #d97706;
    color: #fff;
    border-color: #f59e0b;
    animation: pulseBtn 1.2s infinite;
}

@keyframes pulseBtn {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.badge {
    background: #2563eb;
    color: white;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

@media(max-width: 480px) {
    .badge { display: none; }
}

/* SETTINGS PANEL */
.settings {
    display: none;
    padding: 14px 16px;
    background: #0f172a;
    border-bottom: 1px solid #1f2937;
    flex-shrink: 0;
    max-height: 40vh;
    overflow-y: auto;
}

.settings.show {
    display: block;
}

.voice-settings {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #263244;
}
.voice-setting-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
}
.voice-setting-row label {
    flex: 1;
    font-size: 12px;
    color: #cbd5e1;
}
.voice-setting-row select {
    width: 55%;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f8fafc;
    outline: none;
    font-size: 12px;
}

.settings-title {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #38bdf8;
    display: flex;
    align-items: center;
    gap: 6px;
}

.api-row {
    display: flex;
    gap: 6px;
}

.api-row input {
    flex: 1;
    background: #020617;
    color: white;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 10px;
    outline: none;
    font-size: 12px;
}

.api-row input:focus {
    border-color: #38bdf8;
}

.api-save {
    background: #059669;
    border: none;
    color: white;
    border-radius: 8px;
    padding: 0 14px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    transition: background 0.2s;
}

.api-note {
    color: #94a3b8;
    font-size: 9.5px;
    margin-top: 5px;
    line-height: 1.4;
}

/* CHAT CONTAINER */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #0b0f19;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
}

/* WELCOME SCREEN */
.welcome-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: auto;
    padding: 20px;
    max-width: 600px;
    background: transparent;
    border: none;
    box-shadow: none;
}

.welcome-title {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(56, 189, 248, 0.2);
}

.welcome-subtitle {
    font-size: 14px;
    color: #cbd5e1;
    line-height: 1.6;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.6;
    word-wrap: break-word;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.user-message {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
}

.ai-message {
    align-self: flex-start;
    background: #1e293b;
    color: #f1f5f9;
    border: 1px solid #334155;
    border-bottom-left-radius: 4px;
}

.ai-message p { margin-bottom: 6px; }
.ai-message ul { margin-left: 18px; margin-bottom: 6px; }
.ai-message li { margin-bottom: 3px; }
.ai-message strong { color: #38bdf8; }

.file-image {
    display: block;
    max-width: 220px;
    width: 100%;
    border-radius: 8px;
    margin-top: 6px;
    border: 1px solid #475569;
}

.poster-canvas-preview {
    display: block;
    max-width: 100%;
    width: 380px;
    border-radius: 10px;
    margin-top: 5px;
    border: 2px solid #38bdf8;
    box-shadow: 0 5px 20px rgba(56, 189, 248, 0.3);
    cursor: pointer;
}

/* TYPING ANIMATION */
.typing {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #94a3b8;
    font-style: italic;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #38bdf8;
    animation: blink 1.2s infinite ease-in-out;
}

.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.2); }
}

/* PREVIEW BAR */
.preview {
    display: none;
    align-items: center;
    gap: 8px;
    background: #1e293b;
    border-top: 1px solid #334155;
    padding: 6px 14px;
    font-size: 11.5px;
    color: #38bdf8;
    flex-shrink: 0;
}

.preview.show { display: flex; }
.preview img { width: 35px; height: 35px; object-fit: cover; border-radius: 6px; }
.remove-file { margin-left: auto; cursor: pointer; color: #f87171; font-size: 15px; }

/* HINT */
.hint {
    background: #111827;
    color: #64748b;
    text-align: center;
    padding: 4px;
    font-size: 9.5px;
    border-top: 1px solid #1f2937;
    flex-shrink: 0;
}

/* INPUT AREA */
.input-area {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #111827;
    padding: 14px 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
}

.textarea {
    flex: 1;
    height: 60px;
    max-height: 150px;
    resize: none;
    outline: none;
    border: 1px solid #334155;
    background: #020617;
    color: white;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    transition: border-color 0.2s;
}

.textarea:focus { border-color: #38bdf8; }

.btn {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border: none;
    border-radius: 14px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: transform 0.1s, background 0.2s;
}

.btn:active { transform: scale(0.95); }
.attach { background: #334155; }
.attach:hover { background: #475569; }
.mic { background: #d97706; }
.mic.listening { background: #dc2626; animation: micPulse 1s infinite; }
.send { background: #059669; }
.send:hover { background: #047857; }

@keyframes micPulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220,38,38,0.4); }
    70% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(220,38,38,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220,38,38,0); }
}

.action-btn {
    background: #0284c7;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 8px;
    font-size: 11.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 0.2s;
}

.action-btn:hover { opacity: 0.9; }

@media(max-width:600px) {
    .hint { display: none; }
}
</style>
</head>

<body>

<div class="app">
    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <div class="brand-icon">
                <img src="Academy_logo.jpg" alt="Academy Logo" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-robot\'></i>'">
            </div>
            <div class="brand-text">
                <h1>Gen-P AI</h1>
                <small>Parashar Educational Academy</small>
            </div>
        </div>
        <div class="header-actions">
            <span class="badge">AI MENTOR</span>
            <!-- हेडर का स्मार्ट वॉइस बटन (Pause, Resume और Mute के साथ) -->
            <button class="header-btn" id="muteToggleBtn" onclick="handleHeaderVoiceButton()" title="आवाज़ नियंत्रण">
                <i class="fa-solid fa-volume-high" id="muteIcon"></i>
            </button>
            <button class="header-btn" onclick="toggleSettings()" title="Settings">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button class="header-btn" onclick="startNewChat()" title="नई चैट शुरू करें">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
        </div>
    </header>

    <!-- SETTINGS PANEL -->
    <section class="settings" id="settings">
        <div class="settings-title">
            <i class="fa-solid fa-key"></i> Gen-P AI Key Configuration
        </div>
        <div class="api-row">
            <input id="apiKeyInput" type="password" placeholder="अपनी Gemini API key यहाँ दर्ज करें" autocomplete="off">
            <button class="api-save" onclick="saveApiKey()">Save Key</button>
        </div>
        <div class="api-note">💡 यह API key आपके browser के Local Storage में सुरक्षित रहती है।</div>
        <div class="voice-settings">
            <div class="settings-title"><i class="fa-solid fa-microphone-lines"></i> Voice Settings</div>
            <div class="voice-setting-row">
                <label for="inputLanguage">🎤 बोलने की भाषा</label>
                <select id="inputLanguage">
                    <option value="hi-IN">हिंदी / Hinglish</option>
                    <option value="en-IN">English (India)</option>
                    <option value="en-US">English (US)</option>
                </select>
            </div>
            <div class="voice-setting-row">
                <label for="outputVoice">🔊 Gen-P AI की आवाज़</label>
                <select id="outputVoice">
                    <option value="auto">Auto / Browser Default</option>
                </select>
            </div>
            <div class="voice-setting-row">
                <label for="voiceRate">⚡ बोलने की Speed</label>
                <select id="voiceRate">
                    <option value="0.85">धीमी</option>
                    <option value="0.95" selected>Normal</option>
                    <option value="1.05">तेज़</option>
                    <option value="1.15">बहुत तेज़</option>
                </select>
            </div>
        </div>
    </section>

    <!-- CHAT CONTAINER -->
    <main class="chat" id="chat">
        <!-- Welcoming container or messages will be loaded dynamically -->
    </main>

    <!-- FILE PREVIEW -->
    <div class="preview" id="preview">
        <img id="previewImage" alt="File preview">
        <span id="fileName">File selected</span>
        <span class="remove-file" onclick="removeFile()" title="फाइल हटाएं">
            <i class="fa-solid fa-xmark"></i>
        </span>
    </div>

    <div class="hint">
        💡 Enter = भेजें | Shift + Enter = नई लाइन | 🎤 बोलकर सवाल पूछें
    </div>

    <!-- INPUT AREA -->
    <div class="input-area">
        <input type="file" id="fileInput" hidden accept="image/*,application/pdf" onchange="handleFile(event)">
        <button class="btn attach" onclick="document.getElementById('fileInput').click()" title="Image या PDF जोड़ें">
            <i class="fa-solid fa-paperclip"></i>
        </button>
        <textarea class="textarea" id="userInput" placeholder="अपना सवाल यहाँ लिखें या बोलें..." onkeydown="handleKey(event)" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        <button class="btn mic" id="micButton" onclick="toggleMic()" title="बोलकर सवाल पूछें">
            <i class="fa-solid fa-microphone" id="micIcon"></i>
        </button>
        <button class="btn send" onclick="sendMessage()" title="संदेश भेजें">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
const MODEL_NAME = "gemini-3.8-flash"; 
const IMAGE_MODEL_NAME = "gemini-3.1-flash-image"; 

const HARDCODED_API_KEY = ""; 

const SYSTEM_INSTRUCTION = `
You are Gen-P AI (जेन-पी एआई), the official advanced AI mentor and digital representative created exclusively by and for Parashar Educational Academy, located in Subhashgarh, Haridwar (Website: peacademy.in, Phone: 9997064263).

CORE ACADEMY PROFILE & POLICIES (Strictly to be followed):
1. AFFILIATION & CLASSES: Parashar Educational Academy is an English-medium, co-educational school recognized by the District Education Officer (DEO) / State Board, Uttarakhand. We offer classes from Playgroup/Nursery up to Class 8.
2. FEES & ACCESSIBILITY: We maintain the most affordable and economical fee structure in our region, ensuring high-quality education is accessible to all. We also accept admissions under RTE (Right to Education) and facilitate all government welfare schemes for eligible students.
3. NO-TUITION POLICY: We strictly discourage and ban external tuitions. Our philosophy is that when parents invest their trust and fees in us, it is our core responsibility to teach and groom children thoroughly during school hours (5-6 hours). If a child cannot learn in school, a 1-hour tuition outside won't help. We focus on practical, experiential, and future-ready learning.
4. NEP 2020 & BAGLESS SCHOOLING: We strictly follow the National Education Policy (NEP 2020). Pre-primary classes (Playgroup, Nursery, LKG, UKG) operate under a complete "Bagless Schooling" system to protect tiny tots from heavy school bags.
5. ACTIVITIES: Along with strong academics, we regularly conduct sports, arts, and cultural events for holistic child development. Detailed information is available on our official website peacademy.in.
6. CHILD ENGAGEMENT & PARENT SUPPORT: If a parent mentions that their child is bored at home or watching too much TV, you must act like a friendly, caring teacher. Kindly and creatively engage the child or parent by suggesting fun, educational, and offline activities, puzzles, or simple riddles to draw them away from screens.
7. COMMUNICATION STYLE: Answer questions precisely, practically, and concisely. Do not dump all information at once unless asked. Sound like an experienced, wise, and warm school administrator or senior teacher. If an unknown specific query arises, politely guide them to check peacademy.in or call 9997064263.
8. CURRENT TIME CONTEXT: Current academic session is 2026-27. Use live search grounding when required for latest general knowledge or updates.
`;

let apiKey = HARDCODED_API_KEY || localStorage.getItem("zenp_api_key") || "";
let conversation = JSON.parse(localStorage.getItem("zenp_chat_history") || "[]");
let selectedFile = null;
let recognition = null;
let listening = false;
let isVoiceMuted = false;
let lastInputWasVoice = false;
let currentUtterance = null;
let speechVoices = [];
let selectedOutputVoice = localStorage.getItem("zenp_voice_name") || "auto";
let voiceRate = parseFloat(localStorage.getItem("zenp_voice_rate") || "0.95");
let inputLanguage = localStorage.getItem("zenp_input_lang") || "hi-IN";

document.addEventListener("DOMContentLoaded", () => {
    if (HARDCODED_API_KEY) {
        apiKey = HARDCODED_API_KEY;
    }
    const keyInput = document.getElementById("apiKeyInput");
    if (apiKey) {
        keyInput.value = apiKey;
        document.getElementById("settings").classList.remove("show");
    } else {
        document.getElementById("settings").classList.add("show");
    }
    renderChatHistory();
    setupSpeechRecognition();
    setupVoiceSettings();
    loadSpeechVoices();
    warmupAIModel();
});

async function warmupAIModel() {
    if (!apiKey) return;
    try {
        fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: "ping" }] }] })
        }).catch(() => {});
    } catch(e) {}
}

document.addEventListener("click", function(event) {
    const settingsPanel = document.getElementById("settings");
    const settingsBtn = document.querySelector("[title='Settings']");
    if (settingsPanel && settingsPanel.classList.contains("show")) {
        if (!settingsPanel.contains(event.target) && settingsBtn && !settingsBtn.contains(event.target)) {
            settingsPanel.classList.remove("show");
        }
    }
});

function saveChatHistory() {
    localStorage.setItem("zenp_chat_history", JSON.stringify(conversation));
}

function renderChatHistory() {
    const chatContainer = document.getElementById("chat");
    chatContainer.innerHTML = "";
    
    if (conversation.length === 0) {
        chatContainer.innerHTML = `
            <div class="welcome-container" id="welcomeContainer">
                <h2 class="welcome-title">Hello, I am Gen-P AI</h2>
                <p class="welcome-subtitle">Parashar Educational Academy (सुभाषगढ़, हरिद्वार) की आधिकारिक एआई मेंटर। बताइए, आज आपकी किस प्रकार सहायता की जाए?</p>
            </div>
        `;
        return;
    }

    for (const msg of conversation) {
        const div = document.createElement("div");
        if (msg.role === "user") {
            div.className = "message user-message";
            div.innerHTML = escapeHTML(msg.text || "");
        } else {
            div.className = "message ai-message";
            div.innerHTML = formatAIText(msg.text || "");
        }
        chatContainer.appendChild(div);
    }
    scrollChat();
}

function toggleSettings() {
    document.getElementById("settings").classList.toggle("show");
}

/* हेडर का स्मार्ट वॉइस बटन लॉजिक: Mute -> Pause -> Play (Resume) */
function handleHeaderVoiceButton() {
    const btn = document.getElementById("muteToggleBtn");
    const icon = document.getElementById("muteIcon");

    if (!("speechSynthesis" in window)) return;

    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause();
        btn.className = "header-btn active-speaking";
        icon.className = "fa-solid fa-play";
        btn.title = "आवाज़ आगे शुरू करें (Resume)";
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        btn.className = "header-btn active-speaking";
        icon.className = "fa-solid fa-pause";
        btn.title = "आवाज़ रोकें (Pause)";
    } else {
        isVoiceMuted = !isVoiceMuted;
        if (isVoiceMuted) {
            stopSpeaking();
            btn.className = "header-btn active-mute";
            icon.className = "fa-solid fa-volume-xmark";
            btn.title = "आवाज़ बंद है (चालू करें)";
        } else {
            btn.className = "header-btn";
            icon.className = "fa-solid fa-volume-high";
            btn.title = "आवाज़ चालू है (बंद करें)";
        }
    }
}

function updateHeaderVoiceUI(state) {
    const btn = document.getElementById("muteToggleBtn");
    const icon = document.getElementById("muteIcon");
    if (!btn || !icon) return;

    if (state === "speaking") {
        btn.className = "header-btn active-speaking";
        icon.className = "fa-solid fa-pause";
        btn.title = "आवाज़ रोकें (Pause)";
    } else if (state === "paused") {
        btn.className = "header-btn active-speaking";
        icon.className = "fa-solid fa-play";

            btn.className = "header-btn";
            icon.className = "fa-solid fa-volume-high";
            btn.title = "आवाज़ चालू है (बंद करें)";
        }
    }
}

function compressImage(file) {
    return new Promise((resolve) => {
        if (!file.type.startsWith("image/")) {
            resolve(file);
            return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement("canvas");
                let width = img.width;
                let height = img.height;
                const MAX_WIDTH = 1200;
                const MAX_HEIGHT = 1200;
                if (width > height) {
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                } else {
                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => {
                    const compressedFile = new File([blob], file.name, {
                        type: "image/jpeg",
                        lastModified: Date.now()
                    });
                    resolve(compressedFile);
                }, "image/jpeg", 0.85);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

async function handleFile(event) {
    const rawFile = event.target.files[0];
    if (!rawFile) return;
    if (!rawFile.type.startsWith("image/") && rawFile.type !== "application/pdf") {
        alert("कृपया केवल Image या PDF फ़ाइल चुनें।");
        event.target.value = "";
        return;
    }
    if (rawFile.size > 20 * 1024 * 1024) {
        alert("फाइल का साइज़ 20 MB से कम होना चाहिए।");
        event.target.value = "";
        return;
    }
    
    selectedFile = await compressImage(rawFile);
    document.getElementById("fileName").textContent = selectedFile.name;
    if (selectedFile.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.getElementById("previewImage");
            img.src = e.target.result;
            img.style.display = "block";
        };
        reader.readAsDataURL(selectedFile);
    } else {
        document.getElementById("previewImage").style.display = "none";
    }
    document.getElementById("preview").classList.add("show");
}

function removeFile() {
    selectedFile = null;
    document.getElementById("fileInput").value = "";
    document.getElementById("preview").classList.remove("show");
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

/* मोबाइल-फ्रेंडली स्टेबल सिंगल-शॉट डिक्टेशन (बिना दोहराव और बिना अटके) */
function setupSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        recognition = null;
        return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = inputLanguage;
    recognition.continuous = false; 
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        listening = true;
        updateMicUI(true);
    };

    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            transcript += event.results[i][0].transcript;
        }
        if (transcript.trim()) {
            const formatted = transcript.trim().replace(/जयंती|जान पी|जैन पी|जेन की/gi, "Gen-P AI");
            document.getElementById("userInput").value = formatted;
        }
    };

    recognition.onerror = (event) => {
        listening = false;
        updateMicUI(false);
    };

    recognition.onend = () => {
        listening = false;
        updateMicUI(false);
    };
}

function startListening() {
    if (!recognition) {
        alert("आपका ब्राउज़र वॉइस डिक्टेशन सपोर्ट नहीं करता।");
        return;
    }
    try {
        stopSpeaking();
        recognition.lang = inputLanguage;
        recognition.start();
    } catch (e) {
        listening = false;
        updateMicUI(false);
    }
}

function toggleMic() {
    if ("speechSynthesis" in window && (window.speechSynthesis.speaking || window.speechSynthesis.paused)) {
        stopSpeaking();
        return;
    }
    if (listening) {
        listening = false;
        try { recognition.stop(); } catch(e) {}
        updateMicUI(false);
        return;
    }
    lastInputWasVoice = true;
    startListening();
}

function setupVoiceSettings() {
    const lang = document.getElementById("inputLanguage");
    const voice = document.getElementById("outputVoice");
    const rate = document.getElementById("voiceRate");
    if (lang) {
        lang.value = inputLanguage;
        lang.addEventListener("change", () => {
            inputLanguage = lang.value;
            localStorage.setItem("zenp_input_lang", inputLanguage);
            if (recognition) recognition.lang = inputLanguage;
        });
    }
    if (rate) {
        rate.value = String(voiceRate);
        rate.addEventListener("change", () => {
            voiceRate = parseFloat(rate.value) || 0.95;
            localStorage.setItem("zenp_voice_rate", String(voiceRate));
        });
    }
    if (voice) {
        voice.value = selectedOutputVoice;
        voice.addEventListener("change", () => {
            selectedOutputVoice = voice.value;
            localStorage.setItem("zenp_voice_name", selectedOutputVoice);
        });
    }
}

function loadSpeechVoices() {
    if (!("speechSynthesis" in window)) return;
    const refresh = () => {
        speechVoices = window.speechSynthesis.getVoices() || [];
        const select = document.getElementById("outputVoice");
        if (!select) return;
        const old = selectedOutputVoice;
        select.innerHTML = "<option value=\"auto\">Auto / Browser Default</option>";
        speechVoices.forEach((v) => {
            const opt = document.createElement("option");
            opt.value = v.name;
            const genderHint = /female|woman|girl|zira|samantha|susan|karen|google हिन्दी|google hindi/i.test(v.name) ? " 👩" : /male|man|boy|david|mark|alex/i.test(v.name) ? " 👨" : "";
            opt.textContent = `${v.name} (${v.lang})${genderHint}`;
            select.appendChild(opt);
        });
        select.value = speechVoices.some(v => v.name === old) ? old : "auto";
        selectedOutputVoice = select.value;
    };
    refresh();
    window.speechSynthesis.onvoiceschanged = refresh;
}

function updateMicUI(isListening) {
    const button = document.getElementById("micButton");
    const icon = document.getElementById("micIcon");
    if (!button || !icon) return;

    if (isListening) {
        button.className = "btn mic listening";
        icon.className = "fa-solid fa-microphone-slash";
        button.title = "बोलना बंद करें";
        return;
    }

    button.className = "btn mic";
    icon.className = "fa-solid fa-microphone";
    button.title = "बोलकर सवाल पूछें";
}

function speak(text) {
    if (isVoiceMuted || !("speechSynthesis" in window)) return;
    stopSpeaking();

    const clean = text
        .replace(/[#*`_~()-]/g, " ")
        .replace(/https?:\/\/\S+/g, "")
        .replace(/\s+/g, " ")
        .trim();

    if (!clean) return;

    currentUtterance = new SpeechSynthesisUtterance(clean);
    currentUtterance.lang = /[a-zA-Z]/.test(clean) && !/[ऀ-ॿ]/.test(clean) ? "en-IN" : "hi-IN";
    currentUtterance.rate = voiceRate;

    const voices = window.speechSynthesis.getVoices();
    if (selectedOutputVoice !== "auto") {
        const chosen = voices.find(v => v.name === selectedOutputVoice);
        if (chosen) {
            currentUtterance.voice = chosen;
            currentUtterance.lang = chosen.lang || currentUtterance.lang;
        }
    } else {
        const preferred = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("hi")) ||
                        voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en-in")) ||
                        voices[0];
        if (preferred) {
            currentUtterance.voice = preferred;
            currentUtterance.lang = preferred.lang || currentUtterance.lang;
        }
    }

    updateHeaderVoiceUI("speaking");

    currentUtterance.onend = currentUtterance.onerror = () => {
        currentUtterance = null;
        updateHeaderVoiceUI("normal");
    };

    window.speechSynthesis.speak(currentUtterance);
}

function stopSpeaking() {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    currentUtterance = null;
    updateHeaderVoiceUI("normal");
}

function handleKey(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        lastInputWasVoice = false;
        sendMessage();
    }
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

/* हैश (#) और अजीब फॉर्मेटिंग हटाने तथा साफ-सुथरा प्रोफेशनल टेक्स्ट दिखाने का फंक्शन */
function formatAIText(text) {
    // अगर एआई ने हैश (#) या मार्कडाउन हेडिंग्स दी हैं, तो उन्हें हटाकर साफ़ टेक्स्ट में बदलें
    let cleaned = text.replace(/^[#*_\-\s]+/gm, "").replace(/#{1,6}\s?/g, "");
    let safe = escapeHTML(cleaned);
    
    safe = safe.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
               .replace(/\*(.*?)\*/g, "<em>$1</em>")
               .replace(/`([^`]+)`/g, "<code>$1</code>");
               
    const lines = safe.split("\n");
    let html = "";
    let listOpen = false;
    for (let line of lines) {
        line = line.trim();
        if (line.startsWith("- ") || line.startsWith("* ")) {
            if (!listOpen) { html += "<ul>"; listOpen = true; }
            html += "<li>" + line.substring(2) + "</li>";
        } else {
            if (listOpen) { html += "</ul>"; listOpen = false; }
            if (line) html += "<p>" + line + "</p>";
        }
    }
    if (listOpen) html += "</ul>";
    return html;
}

async function generateAIImage(prompt, sourceFile = null) {
    const inputParts = [];
    if (sourceFile && sourceFile.type.startsWith("image/")) {
        const base64 = await fileToBase64(sourceFile);
        inputParts.push({ inlineData: { mimeType: sourceFile.type, data: base64 } });
    }
    
    inputParts.push({ text: prompt });

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${IMAGE_MODEL_NAME}:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            contents: [{ parts: inputParts }]
        })
    });

    const data = await response.json();
    if (!response.ok) {
        throw new Error(data?.error?.message || `Image API error (${response.status})`);
    }

    let imageData = "";
    let mimeType = "image/png";

    try {
        const part = data.candidates[0].content.parts[0];
        if (part.inlineData) {
            imageData = part.inlineData.data;
            mimeType = part.inlineData.mimeType || mimeType;
        }
    } catch (e) {}

    if (!imageData && Array.isArray(data?.candidates)) {
        for (const candidate of data.candidates) {
            if (candidate.content && Array.isArray(candidate.content.parts)) {
                for (const p of candidate.content.parts) {
                    if (p.inlineData && p.inlineData.data) {
                        imageData = p.inlineData.data;
                        mimeType = p.inlineData.mimeType || mimeType;
                        break;
                    }
                }
            }
        }
    }

    if (!imageData) throw new Error("क्षमा करें, यह इमेज अभी जनरेट नहीं हो सकती है। कृपया कुछ देर बाद दोबारा प्रयास करें।");
    return `data:${mimeType};base64,${imageData}`;
}

function isImageGenerationRequest(text) {
    return /(?:generate|create|make|draw|design|edit|modify|change|remove|add|transform|turn|convert|बनाओ|बनाइए|बनाना|तैयार|डिज़ाइन|डिजाइन|एडिट|बदल|हटाओ|जोड़ो|पोस्टर|बैनर|तस्वीर|चित्र|फोटो|इमेज|ग्राफिक|गणेश|ganesh|festival|admission|thumbnail|wallpaper)/i.test(text);
}

async function sendMessage() {
    stopSpeaking();
    if (listening) {
        listening = false;
        try { recognition.stop(); } catch(e) {}
        updateMicUI(false);
    }

    if (!apiKey) {
        apiKey = HARDCODED_API_KEY || localStorage.getItem("zenp_api_key"] || "";
    }

    if (!apiKey) {
        document.getElementById("settings").classList.add("show");
        alert("कृपया पहले Settings (गियर आइकॉन) में जाकर अपनी Gen-P AI API key सहेजें।");
        return;
    }

    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text && !selectedFile) return;

    let userHTML = escapeHTML(text);
    if (selectedFile) {
        if (selectedFile.type.startsWith("image/")) {
            userHTML += `<img class="file-image" src="${URL.createObjectURL(selectedFile)}" alt="Uploaded image">`;
        } else {
            userHTML += `<br><small>📄 ${escapeHTML(selectedFile.name)}</small>`;
        }
    }
    
    input.value = "";
    input.blur();

    appendUser(userHTML);
    conversation.push({ role: "user", text: text });
    saveChatHistory();

    const currentText = text || "इस uploaded file को analyze करें और इसके प्रश्न-उत्तर हल करें।";
    const fileForRequest = selectedFile;
    removeFile();
    appendTyping();

    try {
        const lowerText = currentText.toLowerCase();
        let isImageRequest = isImageGenerationRequest(currentText) && !fileForRequest;
        let isVideoRequest = /video|reel|animation|clip|वीडियो|रील|एनीमेशन/i.test(lowerText);

        if (isImageRequest && !fileForRequest) {
            const imageDataUrl = await generateAIImage(currentText, null);
            removeTyping();
            const imageHTML = `<div style="margin-top:5px;"><img class="poster-canvas-preview" src="${imageDataUrl}" alt="Gen-P AI Generated Image" onclick="window.open('${imageDataUrl}', '_blank')" title="बड़ा देखने के लिए क्लिक करें"></div>`;
            appendAI(imageHTML);
            conversation.push({ role: "model", text: "आपकी AI image तैयार है।" });
            saveChatHistory();
            if (lastInputWasVoice) speak("आपकी AI image तैयार है।");
            lastInputWasVoice = false;
            return;
        }

        const parts = [{ text: currentText }];
        if (fileForRequest) {
            const base64 = await fileToBase64(fileForRequest);
            parts.push({
                inlineData: {
                    mimeType: fileForRequest.type,
                    data: base64
                }
            });
        }

        const historyContents = conversation.slice(-8, -1).map(m => ({
            role: m.role === "user" ? "user" : "model",
            parts: [{ text: m.text }]
        }));

        const contents = [...historyContents, { role: "user", parts: parts }];
        const apiEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;

        // मोबाइल पर गति और टाइमआउट से बचने के लिए ऑप्टिमाइज़्ड रिक्वेस्ट (बिना भारी सर्च टूल के तुरंत रिस्पांस)
        const response = await fetch(apiEndpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                contents: contents,
                generationConfig: { temperature: 0.7, maxOutputTokens: 1024 }
            })
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data?.error?.message || `API error (${response.status})`);
        }

        let aiText = extractResponseText(data);
        if (!aiText) {
            aiText = "यहाँ आपके निर्देशानुसार जानकारी दी गई है:";
        }

        conversation.push({ role: "model", text: aiText });
        saveChatHistory();

        removeTyping();
        let formatted = formatAIText(aiText);

        if (isVideoRequest) {
            formatted += `<br><button class="action-btn" style="background:#dc2626;" onclick="alert('वीडियो स्क्रिप्ट तैयार है। इसे आप Sora या Runway AI में उपयोग कर सकते हैं।')"><i class="fa-solid fa-video"></i> वीडियो स्क्रिप्ट जनरेटेड</button>`;
        }

        if (/pdf|report|रिपोर्ट|डॉक्यूमेंट/i.test(text)) {
            formatted += `<br><button class="action-btn" onclick="downloadPDF(this)"><i class="fa-solid fa-file-pdf"></i> PDF रिपोर्ट डाउनलोड करें</button>`;
        }

        appendAI(formatted);
        
        if (lastInputWasVoice) {
            speak(aiText);
        }
        lastInputWasVoice = false;

    } catch (error) {
        removeTyping();
        lastInputWasVoice = false;
        appendAI(`<p>❌ <b>त्रुटि:</b></p><p>${escapeHTML(error.message)}</p>`);
    }
}

function extractResponseText(data) {
    try {
        return data.candidates[0].content.parts[0].text;
    } catch (e) {
        return "";
    }
}

function downloadPDF(button) {
    if (typeof html2pdf === "undefined") {
        alert("PDF लाइब्रेरी लोड नहीं हो पाई है।");
        return;
    }
    const message = button.closest(".ai-message");
    const clone = message.cloneNode(true);
    const pdfButtons = clone.querySelectorAll(".action-btn");
    pdfButtons.forEach(btn => btn.remove());

    const wrapper = document.createElement("div");
    wrapper.style.background = "white";
    wrapper.style.color = "black";
    wrapper.style.padding = "25px";
    wrapper.innerHTML = `<h2>Parashar Educational Academy</h2><h3>Gen-P AI Report</h3><hr style="margin:12px 0;">${clone.innerHTML}`;

    html2pdf().set({ margin: 10, filename: "Gen-P_Report.pdf", html2canvas: { scale: 2 } }).from(wrapper).save();
}
