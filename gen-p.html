<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zen-P - Parashar Educational Academy</title>
<link rel="icon" type="image/jpeg" href="Academy_logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
}

html, body {
    background: #0b0f19;
    color: #f1f5f9;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.app {
    width: 100%;
    max-width: 1000px;
    height: 100vh;
    height: 100dvh;
    background: #111827;
    border: none;
    border-radius: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: none;
}

@media(min-width: 768px) {
    .app {
        height: 95vh;
        border: 1px solid #1f2937;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
}

/* HEADER */
.header {
    background: #0f172a;
    border-bottom: 1px solid #1f2937;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #1e293b;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    border: 1px solid #334155;
    flex-shrink: 0;
}

.brand-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.brand-text {
    min-width: 0;
}

.brand h1 {
    font-size: 15px;
    color: #38bdf8;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.brand small {
    display: block;
    font-size: 9.5px;
    color: #94a3b8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.header-btn {
    border: 1px solid #334155;
    background: #1e293b;
    color: #cbd5e1;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
}

.header-btn:hover {
    background: #334155;
    color: #fff;
}

.badge {
    background: #2563eb;
    color: white;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

@media(max-width: 480px) {
    .badge { display: none; }
}

/* SETTINGS PANEL */
.settings {
    display: none;
    padding: 14px 16px;
    background: #0f172a;
    border-bottom: 1px solid #1f2937;
    flex-shrink: 0;
    max-height: 40vh;
    overflow-y: auto;
}

.settings.show {
    display: block;
}

.voice-settings {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #263244;
}
.voice-setting-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
}
.voice-setting-row label {
    flex: 1;
    font-size: 12px;
    color: #cbd5e1;
}
.voice-setting-row select {
    width: 55%;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f8fafc;
    outline: none;
    font-size: 12px;
}

.settings-title {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #38bdf8;
    display: flex;
    align-items: center;
    gap: 6px;
}

.api-row {
    display: flex;
    gap: 6px;
}

.api-row input {
    flex: 1;
    background: #020617;
    color: white;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 10px;
    outline: none;
    font-size: 12px;
}

.api-row input:focus {
    border-color: #38bdf8;
}

.api-save {
    background: #059669;
    border: none;
    color: white;
    border-radius: 8px;
    padding: 0 14px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    transition: background 0.2s;
}

.api-note {
    color: #94a3b8;
    font-size: 9.5px;
    margin-top: 5px;
    line-height: 1.4;
}

/* CHAT CONTAINER */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #0b0f19;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
}

/* GEMINI STYLE WELCOME SCREEN */
.welcome-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: auto;
    padding: 20px;
    max-width: 600px;
}

.welcome-logo {
    width: 65px;
    height: 65px;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 14px;
    border: 2px solid #38bdf8;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
}

.welcome-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.welcome-title {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
}

.welcome-subtitle {
    font-size: 13.5px;
    color: #94a3b8;
    line-height: 1.5;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.6;
    word-wrap: break-word;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.user-message {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
}

.ai-message {
    align-self: flex-start;
    background: #1e293b;
    color: #f1f5f9;
    border: 1px solid #334155;
    border-bottom-left-radius: 4px;
}

.ai-message p { margin-bottom: 6px; }
.ai-message ul { margin-left: 18px; margin-bottom: 6px; }
.ai-message li { margin-bottom: 3px; }
.ai-message strong { color: #38bdf8; }

.file-image {
    display: block;
    max-width: 220px;
    width: 100%;
    border-radius: 8px;
    margin-top: 6px;
    border: 1px solid #475569;
}

.poster-canvas-preview {
    display: block;
    max-width: 100%;
    width: 380px;
    border-radius: 10px;
    margin-top: 5px;
    border: 2px solid #38bdf8;
    box-shadow: 0 5px 20px rgba(56, 189, 248, 0.3);
}

/* TYPING ANIMATION */
.typing {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #94a3b8;
    font-style: italic;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #38bdf8;
    animation: blink 1.2s infinite ease-in-out;
}

.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.2); }
}

/* PREVIEW BAR */
.preview {
    display: none;
    align-items: center;
    gap: 8px;
    background: #1e293b;
    border-top: 1px solid #334155;
    padding: 6px 14px;
    font-size: 11.5px;
    color: #38bdf8;
    flex-shrink: 0;
}

.preview.show { display: flex; }
.preview img { width: 35px; height: 35px; object-fit: cover; border-radius: 6px; }
.remove-file { margin-left: auto; cursor: pointer; color: #f87171; font-size: 15px; }

/* VOICE STATUS BAR */
.voice-bar {
    display: none;
    background: #0f172a;
    border-top: 1px solid #334155;
    padding: 6px 14px;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.voice-bar.show { display: flex; }
.voice-status { flex: 1; font-size: 10.5px; color: #38bdf8; font-weight: 500; }
.voice-btn { border: none; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 10.5px; font-weight: 500; }
.pause { background: #d97706; }
.stop { background: #dc2626; }

/* HINT */
.hint {
    background: #111827;
    color: #64748b;
    text-align: center;
    padding: 4px;
    font-size: 9.5px;
    border-top: 1px solid #1f2937;
    flex-shrink: 0;
}

/* INPUT AREA */
.input-area {
