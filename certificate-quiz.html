<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Master Quiz Portal | Parashar Educational Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@700;800&family=Parisienne&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .portal-navbar { width: 100%; background: #1e293b; color: #ffffff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #d97706; }
        .main-container { padding: 30px 20px; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 800px; }
        .quiz-wrapper { width: 100%; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: 600; }
        .option-btn { width: 100%; padding: 12px; margin-bottom: 8px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; text-align: left; cursor: pointer; }
        #certificate-section { display: none; margin-top: 20px; }
        /* सर्टिफिकेट डिजाइन यहाँ वही फाइनल वाला रहेगा जो पहले था */
    </style>
</head>
<body>

<nav class="portal-navbar">
    <h2>Parashar Educational Academy</h2>
    <a href="https://peacademy.in/calendar" style="color:#fbbf24;">View Calendar</a>
</nav>

<div class="main-container">
    <div class="quiz-wrapper" id="reg-box">
        <div style="padding:20px;">
            <input type="text" id="name" placeholder="Enter participant's full name" style="width:100%; padding:10px; margin-bottom:10px;">
            <button class="btn" onclick="startQuiz()">🚀 Start Challenge</button>
        </div>
    </div>

    <div class="quiz-wrapper" id="quiz-box" style="display:none;">
        <div style="padding:20px;">
            <div id="q-text" style="font-weight:600; margin-bottom:15px;"></div>
            <div id="options"></div>
            <button class="btn" style="background:#dc2626;" onclick="location.reload()">Quit Challenge</button>
        </div>
    </div>
</div>

<script>
    // 200 सवालों का ढांचा
    const eventDatabase = {
        "Independence Day": {
            questions: [
                { q: "First PM of India?", options: ["Nehru", "Gandhi", "Patel"], answer: 0 },
                // यहाँ आप अपने 200 सवाल पेस्ट कर सकते हैं
            ]
        },
        "General": {
            questions: [
                { q: "Capital of India?", options: ["Delhi", "Mumbai", "Jaipur"], answer: 0 },
                // यहाँ 200 जनरल सवाल
            ]
        }
    };

    let currentQ = 0, pool = [], userName = "";

    function startQuiz() {
        userName = document.getElementById('name').value;
        if(!userName) return alert("Enter name");
        
        // रैंडम 10 सवाल उठाना
        let allQs = eventDatabase["Independence Day"].questions; // यहाँ लॉजिक इवेंट के हिसाब से बदल जाएगा
        pool = [...allQs].sort(() => 0.5 - Math.random()).slice(0, 10);
        
        document.getElementById('reg-box').style.display = 'none';
        document.getElementById('quiz-box').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        if(currentQ >= pool.length) return showCert();
        let q = pool[currentQ];
        document.getElementById('q-text').innerText = (currentQ+1) + ". " + q.q;
        let optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        q.options.forEach((opt, i) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                btn.style.background = (i === q.answer) ? '#16a34a' : '#dc2626';
                setTimeout(() => { currentQ++; loadQuestion(); }, 1000);
            };
            optDiv.appendChild(btn);
        });
    }

    function showCert() {
        alert("Challenge Complete! Certificate generated for " + userName);
        location.reload();
    }
</script>
</body>
</html>
